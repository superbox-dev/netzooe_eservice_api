line-length = 120
target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma, conflicts with the formatter
]

[lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert, required by pytest
]

[lint.pydocstyle]
convention = "numpy"

[lint.isort]
force-single-line = true
